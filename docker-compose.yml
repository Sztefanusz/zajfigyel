services:
  noise-monitor:
    build: .
    image: noise-monitor:latest
    container_name: noise-monitor
    ports:
      - "8000:8000"
    environment:
      # How often the backend polls the public sensor network (seconds).
      POLL_INTERVAL_SECONDS: "120"
      # City shown on first load (any id from /api/cities).
      # Berlin usually has the most active noise sensors, so the map is
      # populated out of the box. Change to "budapest" or any other id.
      DEFAULT_CITY: "berlin"
      # Default / maximum radius (km) for location searches.
      DEFAULT_RADIUS_KM: "5"
      MAX_RADIUS_KM: "50"
      # Identify this app to external services (Nominatim / news feeds).
      GEOCODER_USER_AGENT: "noise-monitor/3.0 (self-hosted)"
      NEWS_USER_AGENT: "noise-monitor/3.0 (self-hosted)"
      # History + prediction loop: records per-city data & events this often.
      HISTORY_INTERVAL_SECONDS: "600"
      HISTORY_RETENTION_DAYS: "30"
      # Past/future span (hours) of the time-travel slider.
      PAST_WINDOW_HOURS: "24"
      FUTURE_WINDOW_HOURS: "24"
      # SQLite history DB lives here; persisted via the volume below.
      DB_PATH: "/app/data/noise.db"
      # Canonical public address once deployed behind a domain + HTTPS.
      # Placeholder — replace with your own host, or leave empty for local use.
      # PUBLIC_BASE_URL: "https://noise-monitor.example.com"
    volumes:
      - noise-data:/app/data
    restart: unless-stopped

# ----------------------------------------------------------------------------
# Making it reachable "from anywhere"
# ----------------------------------------------------------------------------
# The service above listens on port 8000 on the host. To expose it on a public
# web address you need (a) a server with a public IP, (b) a domain pointing at
# it, and (c) HTTPS. The optional Caddy reverse proxy below does (c) for you
# with automatic Let's Encrypt certificates.
#
# To enable it:
#   1. Point a DNS A/AAAA record (e.g. noise-monitor.example.com) at the server.
#   2. Edit Caddyfile.example -> copy to "Caddyfile" and set your real domain.
#   3. Run:  docker compose --profile public up --build -d
#   4. Browse to https://your-domain  (Caddy fetches the certificate on first hit).
#
# All addresses here are placeholders — substitute your own.
#
#  caddy:
#    image: caddy:2
#    container_name: noise-monitor-proxy
#    profiles: ["public"]        # only starts with: --profile public
#    depends_on:
#      - noise-monitor
#    ports:
#      - "80:80"
#      - "443:443"
#    volumes:
#      - ./Caddyfile:/etc/caddy/Caddyfile:ro
#      - caddy-data:/data
#      - caddy-config:/config
#    restart: unless-stopped

volumes:
  noise-data:
  # caddy-data:
  # caddy-config:
