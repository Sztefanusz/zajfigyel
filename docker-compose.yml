services:
  noise-monitor:
    build: .
    image: noise-monitor:latest
    container_name: noise-monitor
    ports:
      - "8000:8000"
    environment:
      # How often the backend polls the public sensor network (seconds).
      POLL_INTERVAL_SECONDS: "120"
      # City shown on first load (any id from /api/cities).
      # Berlin usually has the most active noise sensors, so the map is
      # populated out of the box. Change to "budapest" or any other id.
      DEFAULT_CITY: "berlin"
      # Default / maximum radius (km) for location searches.
      DEFAULT_RADIUS_KM: "5"
      MAX_RADIUS_KM: "50"
      # Identify this app to the geocoder (OpenStreetMap Nominatim policy).
      GEOCODER_USER_AGENT: "noise-monitor/2.0 (self-hosted)"
    restart: unless-stopped
